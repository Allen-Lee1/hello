<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Boot</title>
  <style>
    body{margin:0;background:#f3f5f8;color:#243047;font:16px/1.7 system-ui,sans-serif}
    main{max-width:720px;margin:10vh auto;padding:36px;background:#fff;border-radius:16px;box-shadow:0 8px 40px #1829400a}
    h1{margin:0 0 12px}code{background:#eef2f6;padding:3px 7px;border-radius:4px}
    a{color:#2464ce}button{background:#2464ce;color:white;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f8;padding:16px;border-radius:8px}
    @media(max-width:800px){main{margin:24px 16px;padding:24px}}
  </style>
</head>
<body>
<main>
  <h1>Simple Boot 已启动</h1>
  <p>这里是 Web 应用的起点，你可以从这里添加页面和业务功能。</p>
  <p>Web 接口：<a href="/web/info">/web/info</a> · 健康检查：<a href="/actuator/health">/actuator/health</a></p>
  <p>API 应用默认独立运行在 8080 端口。启动后可访问它的 <code>/api/demo/greeting</code> 接口。</p>
  <button id="check" type="button">检查 Web 服务</button>
  <pre id="result" role="status" aria-live="polite">点击按钮，查看当前应用的接口响应。</pre>
</main>
<script>
  document.getElementById('check').addEventListener('click', async () => {
    const result = document.getElementById('result');
    result.textContent = '正在请求…';
    try {
      const response = await fetch('/web/info');
      if (!response.ok) throw new Error('HTTP ' + response.status);
      result.textContent = JSON.stringify(await response.json(), null, 2);
    } catch (error) {
      result.textContent = '请求失败：' + error.message;
    }
  });
</script>
</body>
</html>
